<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GDELT Network Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #f8f9fa; }
  #map { width: 100%; height: 100vh; }

  .leaflet-overlay-pane svg { pointer-events: none; }
  .country-group { pointer-events: none; }
  .drag-handle { pointer-events: all; cursor: grab; }
  .drag-handle:active { cursor: grabbing; }

  .edge-line { fill: none; pointer-events: none; }

  #info-panel {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255,255,255,0.94);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 13px;
    color: #222;
    z-index: 1000;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    display: none;
    max-width: 340px;
  }

  .country-path { stroke: #fff; stroke-width: 0.5; opacity: 0.85; pointer-events: none; }

  #tooltip {
    position: fixed;
    background: rgba(30,30,30,0.88);
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 5px;
    pointer-events: none;
    white-space: nowrap;
    z-index: 3000;
    display: none;
  }

  #legend {
    position: absolute;
    bottom: 24px;
    right: 12px;
    background: rgba(255,255,255,0.92);
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 12px;
    z-index: 1000;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.92);
    border-radius: 8px;
    padding: 16px 24px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 14px;
    color: #555;
    z-index: 2000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="loading">Chargement des frontières pays…</div>
<div id="tooltip"></div>

<div id="info-panel"></div>

<div id="legend">
  <strong>Goldstein Score</strong>
  <div class="legend-item"><div class="legend-dot" style="background:#2ecc71"></div> Positif</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div> Négatif</div>
  <div class="legend-item"><div class="legend-dot" style="background:#95a5a6"></div> Neutre</div>
</div>

<script>
const GEOJSON_URL = "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";

// ── State ─────────────────────────────────────────────────────────────────
let edges = [];
let countryNames = {};
let activeCountries = new Set();   // codes present in current edges
let geoFeatures = {};              // iso3 → GeoJSON Feature (all countries)
let geoCentroids = {};             // iso3 → { lat, lng } from d3.geoCentroid
let offsets = {};                  // iso3 → { dx, dy } in screen pixels
let hoveredCountry = null;
let lockedCountry  = null;
let dragMoved      = false;

// ── Highlight one country's edges; dim everything else ────────────────────
function applyHighlight(code) {
  const connected = new Set();
  let pos = 0, neg = 0, neu = 0;
  for (const e of edges) {
    const match = e.actor1_code === code || e.actor2_code === code;
    if (match) {
      if (e.actor1_code === code) connected.add(e.actor2_code);
      else connected.add(e.actor1_code);
      if (e.goldstein_category === "positif") pos++;
      else if (e.goldstein_category === "negatif") neg++;
      else neu++;
    }
  }
  edgeG.selectAll("line.edge-line")
    .attr("stroke-opacity", e => (e.actor1_code === code || e.actor2_code === code) ? 0.8 : 0.03)
    .attr("stroke-width",   e => (e.actor1_code === code || e.actor2_code === code) ? 2   : 0.5)
    .attr("stroke", e => {
      if (e.actor1_code !== code && e.actor2_code !== code) return "#aaa";
      return e.goldstein_category === "positif" ? "#2ecc71"
           : e.goldstein_category === "negatif" ? "#e74c3c" : "#95a5a6";
    });
  countryG.selectAll("g.country-group").select("path.country-path")
    .attr("opacity", d => d.code === code ? 1.0 : connected.has(d.code) ? 0.9 : 0.4);
  const panel = document.getElementById("info-panel");
  const name = countryNames[code] || code;
  panel.textContent = `${name} — ${pos+neg+neu} relation(s) | ${pos} positive(s) | ${neg} négative(s) | ${neu} neutre(s)`;
  panel.style.display = "block";
}

// ── Reset to default appearance ───────────────────────────────────────────
function clearHighlight() {
  edgeG.selectAll("line.edge-line")
    .attr("stroke-opacity", 0.03)
    .attr("stroke-width",   0.5)
    .attr("stroke", "#aaa");
  countryG.selectAll("g.country-group").select("path.country-path")
    .attr("opacity", 0.85);
  document.getElementById("info-panel").style.display = "none";
}

// ── Deterministic color from 3-letter ISO code ────────────────────────────
function countryColor(code) {
  let h = 0;
  for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) % 360;
  return `hsl(${h}, 60%, 42%)`;
}

// ── Leaflet map ───────────────────────────────────────────────────────────
const map = L.map("map", { zoomControl: true }).setView([20, 10], 2);
L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: "abcd",
    maxZoom: 19,
  }
).addTo(map);

// ── D3 SVG overlay synced with Leaflet ────────────────────────────────────
const svgLayer = L.svg().addTo(map);
const svg = d3.select(map.getPanes().overlayPane).select("svg");
const rootG = svg.append("g").attr("class", "leaflet-zoom-hide");

const edgeG    = rootG.append("g").attr("class", "edges");
const countryG = rootG.append("g").attr("class", "countries");

// ── Leaflet ↔ D3 projection ───────────────────────────────────────────────
function makeGeoPath() {
  const transform = d3.geoTransform({
    point: function(lng, lat) {
      const pt = map.latLngToLayerPoint(L.latLng(lat, lng));
      this.stream.point(pt.x, pt.y);
    }
  });
  return d3.geoPath().projection(transform);
}

// ── Geographic centroid in screen coordinates (no drag offset) ────────────
function geoCentroid(code) {
  const c = geoCentroids[code];
  if (!c) return { x: 0, y: 0 };
  const pt = map.latLngToLayerPoint(L.latLng(c.lat, c.lng));
  return { x: pt.x, y: pt.y };
}

// ── Screen centroid including drag offset (for edge endpoints) ────────────
function screenCentroid(code) {
  const g = geoCentroid(code);
  const o = offsets[code] ?? { dx: 0, dy: 0 };
  return { x: g.x + o.dx, y: g.y + o.dy };
}

// ── Draw / update everything ───────────────────────────────────────────────
function render() {
  const path = makeGeoPath();

  // --- Edges ---
  const visibleEdges = edges.filter(
    e => activeCountries.has(e.actor1_code) && activeCountries.has(e.actor2_code)
      && e.actor1_code !== e.actor2_code
  );

  const edgeSel = edgeG
    .selectAll("line.edge-line")
    .data(visibleEdges, d => `${d.actor1_code}|${d.actor2_code}|${d.goldstein_category}`);

  edgeSel.enter()
    .append("line")
    .attr("class", d => `edge-line ${d.goldstein_category}`)
    .merge(edgeSel)
    .attr("x1", d => screenCentroid(d.actor1_code).x)
    .attr("y1", d => screenCentroid(d.actor1_code).y)
    .attr("x2", d => screenCentroid(d.actor2_code).x)
    .attr("y2", d => screenCentroid(d.actor2_code).y)
    .attr("stroke", "#aaa")
    .attr("stroke-opacity", 0.03)
    .attr("stroke-width", 0.5);

  edgeSel.exit().remove();

  // --- Country silhouettes ---
  const nodeData = [...activeCountries]
    .filter(code => geoFeatures[code] && geoCentroids[code])
    .map(code => ({ code, feature: geoFeatures[code] }));

  const nodeSel = countryG
    .selectAll("g.country-group")
    .data(nodeData, d => d.code);

  const tooltip = document.getElementById("tooltip");

  const nodeEnter = nodeSel.enter()
    .append("g")
    .attr("class", "country-group");

  nodeEnter.append("path").attr("class", "country-path");
  // Invisible circle at centroid — drag target + tooltip trigger
  nodeEnter.append("circle").attr("class", "drag-handle")
    .call(dragBehavior())
    .on("mousemove", function(event, d) {
      tooltip.textContent = countryNames[d.code] || d.code;
      tooltip.style.display = "block";
      tooltip.style.left = (event.clientX + 14) + "px";
      tooltip.style.top  = (event.clientY - 28) + "px";
      if (!lockedCountry) { hoveredCountry = d.code; applyHighlight(d.code); }
    })
    .on("mouseout", function() {
      tooltip.style.display = "none";
      hoveredCountry = null;
      if (!lockedCountry) clearHighlight();
    })
    .on("click", function(event, d) {
      if (dragMoved) return;
      event.stopPropagation();
      if (lockedCountry === d.code) {
        lockedCountry = null;
        clearHighlight();
      } else {
        lockedCountry = d.code;
        applyHighlight(d.code);
      }
    });

  const nodeMerge = nodeEnter.merge(nodeSel);

  // The <g> carries the drag offset; path + label use absolute geo coordinates
  nodeMerge
    .attr("transform", d => {
      const o = offsets[d.code] ?? { dx: 0, dy: 0 };
      return `translate(${o.dx},${o.dy})`;
    });

  nodeMerge.select("path.country-path")
    .attr("d", d => path(d.feature))
    .attr("fill", d => countryColor(d.code));

  nodeMerge.select("circle.drag-handle")
    .attr("cx", d => geoCentroid(d.code).x)
    .attr("cy", d => geoCentroid(d.code).y)
    .attr("r", 40)
    .attr("fill", "transparent");

  nodeSel.exit().remove();

  // Re-apply highlight state after DOM rebuild
  const active = lockedCountry ?? hoveredCountry;
  if (active) applyHighlight(active);
}

// ── Drag behaviour (snap-back on release) ─────────────────────────────────
function dragBehavior() {
  let startPx, startPy, startDx, startDy;

  return d3.drag()
    .on("start", function(event, d) {
      dragMoved = false;
      map.dragging.disable();
      const [px, py] = d3.pointer(event, rootG.node());
      startPx = px;
      startPy = py;
      const o = offsets[d.code] ?? { dx: 0, dy: 0 };
      startDx = o.dx;
      startDy = o.dy;
    })
    .on("drag", function(event, d) {
      const [px, py] = d3.pointer(event, rootG.node());
      if (Math.hypot(px - startPx, py - startPy) > 4) dragMoved = true;
      offsets[d.code] = {
        dx: startDx + (px - startPx),
        dy: startDy + (py - startPy),
      };
      const { dx, dy } = offsets[d.code];
      d3.select(this.parentNode).attr("transform", `translate(${dx},${dy})`);
      edgeG.selectAll("line.edge-line")
        .filter(e => e.actor1_code === d.code || e.actor2_code === d.code)
        .attr("x1", e => screenCentroid(e.actor1_code).x)
        .attr("y1", e => screenCentroid(e.actor1_code).y)
        .attr("x2", e => screenCentroid(e.actor2_code).x)
        .attr("y2", e => screenCentroid(e.actor2_code).y);
    })
    .on("end", function(event, d) {
      map.dragging.enable();
      d3.select(this.parentNode)
        .transition().duration(400).ease(d3.easeCubicOut)
        .attr("transform", "translate(0,0)")
        .on("end", () => { offsets[d.code] = { dx: 0, dy: 0 }; });
      const geo = geoCentroid(d.code);
      edgeG.selectAll("line.edge-line")
        .filter(e => e.actor1_code === d.code || e.actor2_code === d.code)
        .transition().duration(400).ease(d3.easeCubicOut)
        .attr("x1", e => e.actor1_code === d.code ? geo.x : screenCentroid(e.actor1_code).x)
        .attr("y1", e => e.actor1_code === d.code ? geo.y : screenCentroid(e.actor1_code).y)
        .attr("x2", e => e.actor2_code === d.code ? geo.x : screenCentroid(e.actor2_code).x)
        .attr("y2", e => e.actor2_code === d.code ? geo.y : screenCentroid(e.actor2_code).y);
    });
}

// ── Click background → clear lock ─────────────────────────────────────────
map.on("click", () => {
  if (lockedCountry) { lockedCountry = null; clearHighlight(); }
});

// ── Re-project when map moves / zooms ─────────────────────────────────────
map.on("moveend zoomend", () => {
  for (const code of activeCountries) offsets[code] = { dx: 0, dy: 0 };
  render();
});

// ── Load GeoJSON boundaries (all countries) ───────────────────────────────
fetch(GEOJSON_URL)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(geojson => {
    for (const feature of geojson.features) {
      const code = feature.properties["ISO3166-1-Alpha-3"];
      if (!code) continue;
      geoFeatures[code] = feature;
      const [lng, lat] = d3.geoCentroid(feature);
      geoCentroids[code] = { lat, lng };
    }
    document.getElementById("loading").style.display = "none";
    render();
  })
  .catch(err => {
    document.getElementById("loading").textContent =
      "Erreur chargement GeoJSON : " + err.message;
  });

// ── Receive data from Streamlit parent ────────────────────────────────────
window.addEventListener("message", function(event) {
  const msg = event.data;
  if (!msg || msg.type !== "gdelt_data") return;
  edges = msg.edges || [];
  countryNames = msg.country_names || {};

  // Derive the set of countries from the received edges
  const newActive = new Set();
  for (const e of edges) {
    if (e.actor1_code) newActive.add(e.actor1_code);
    if (e.actor2_code) newActive.add(e.actor2_code);
  }
  // Initialise offsets for countries not yet seen
  for (const code of newActive) {
    if (!offsets[code]) offsets[code] = { dx: 0, dy: 0 };
  }
  activeCountries = newActive;

  console.log("[GDELT] edges reçus :", edges.length, "— pays actifs :", activeCountries.size);
  render();
});

window.setData = function(newEdges, names) {
  edges = newEdges;
  countryNames = names || {};
  render();
};
</script>
</body>
</html>
